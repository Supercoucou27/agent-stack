<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes Agent Console</title>
<style>
  :root {
    --bg: #0b0e14; --card: #151922; --border: #2d3342;
    --fg: #e6edf3; --muted: #8b949e; --accent: #388bfd;
    --purple: #a371f7; --green: #2ea043; --red: #f85149;
    --mono: ui-monospace, SFMono-Regular, Consolas, monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font: 13px system-ui, -apple-system, sans-serif; background: var(--bg); color: var(--fg); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  header { height: 46px; padding: 0 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--card); flex-shrink: 0; }
  .nav-tabs { display: flex; gap: 8px; align-items: center; }
  .nav-tab { padding: 6px 14px; border-radius: 6px; font-weight: 500; font-size: 12px; text-decoration: none; color: var(--muted); border: 1px solid transparent; transition: all 0.15s; }
  .nav-tab:hover { background: #21262d; color: var(--fg); }
  .nav-tab.active { background: #1f6feb22; color: #58a6ff; border-color: #1f6feb66; font-weight: 600; }
  
  .badges { display: flex; gap: 8px; align-items: center; }
  .badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-family: var(--mono); background: var(--border); }
  .badge.ok { background: #23863622; color: #3fb950; border: 1px solid #23863666; }
  .badge.err { background: #da363322; color: #f85149; border: 1px solid #da363366; }

  main { flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }
  aside { border-right: 1px solid var(--border); background: var(--card); overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  section.panel { border: 1px solid var(--border); border-radius: 8px; padding: 12px; background: #0e121a; }
  section.panel h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--muted); margin-bottom: 10px; }

  .stat-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
  progress { width: 100%; height: 6px; border-radius: 3px; appearance: none; border: none; background: #21262d; margin-bottom: 8px; }
  progress::-webkit-progress-bar { background: #21262d; border-radius: 3px; }
  progress::-webkit-progress-value { background: var(--purple); border-radius: 3px; }

  input, textarea { width: 100%; background: #0b0e14; color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 7px 10px; font-size: 12px; font-family: inherit; }
  textarea { font-family: var(--mono); resize: none; }
  button { background: #21262d; color: var(--fg); border: 1px solid var(--border); border-radius: 5px; padding: 7px 14px; cursor: pointer; font-size: 12px; font-weight: 500; }
  button:hover { background: #30363d; }
  button.primary { background: var(--green); border-color: #2ea043; color: #fff; }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  .file-list { max-height: 220px; overflow-y: auto; font-family: var(--mono); font-size: 11px; background: #080a0f; border: 1px solid var(--border); border-radius: 4px; padding: 6px; }
  .file-item { padding: 3px 6px; border-bottom: 1px solid #1a202c; display: flex; justify-content: space-between; }

  #workspace { display: flex; flex-direction: column; height: 100%; overflow: hidden; padding: 14px; gap: 10px; }
  #task-input { height: 130px; font-size: 13px; line-height: 1.45; }
  #console-output { flex: 1; background: #05070a; border: 1px solid var(--border); border-radius: 6px; padding: 14px; font-family: var(--mono); font-size: 12px; color: #7ee787; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; }
</style>
</head>
<body>

<header>
  <div class="nav-tabs">
    <a href="/llm" class="nav-tab">🧠 LLM Engine & Hardware</a>
    <a href="/hermes" class="nav-tab active">⚡ Hermes Agent Console</a>
  </div>
  <div class="badges">
    <span id="badge-vram" class="badge">VRAM: -- / 16GB</span>
    <span id="badge-status" class="badge">Agent: Idle</span>
  </div>
</header>

<main>
  <aside>
    <!-- VRAM Summary -->
    <section class="panel">
      <h2>Dual-GPU VRAM Usage</h2>
      <div class="stat-row"><span>Dual GPU Pool</span><span id="txt-vram">-- / 16.0 GB</span></div>
      <progress id="bar-vram" max="100" value="0"></progress>
    </section>

    <!-- Tuning -->
    <section class="panel">
      <h2>Hermes Execution Config</h2>
      <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:8px;">
        <div>
          <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:3px;">Temperature</label>
          <input type="number" id="cfg-temp" value="0.2" step="0.05" min="0" max="1.5">
        </div>
        <div>
          <label style="font-size:11px; color:var(--muted); display:block; margin-bottom:3px;">Max Turns</label>
          <input type="number" id="cfg-iter" value="35" min="1" max="100">
        </div>
      </div>
    </section>

    <!-- Workspace Files -->
    <section class="panel" style="flex:1; display:flex; flex-direction:column; min-height:0;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
        <h2 style="margin:0;">Workspace Files</h2>
        <button onclick="loadFiles()" style="font-size:10px; padding:2px 6px;">Refresh</button>
      </div>
      <div id="file-list" class="file-list" style="flex:1;">Loading files...</div>
    </section>
  </aside>

  <section id="workspace">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h2 style="font-size:12px; text-transform:uppercase; letter-spacing:0.6px; color:var(--muted);">Hermes Autonomous Task Runner</h2>
      <button id="btn-run" class="primary" onclick="launchTask()">▶ Lancer Task</button>
    </div>
    
    <textarea id="task-input" placeholder="Give an autonomous task to Hermes Agent (e.g. Build RSI quantitative trading system, run tests with pytest, inspect system)..."></textarea>
    
    <div id="console-output">Waiting for task execution...</div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);

async function updateStats() {
  try {
    const res = await fetch('/api/stats');
    const d = await res.json();
    if (d.vram_pool) {
      $('bar-vram').value = d.vram_pool.percent;
      $('txt-vram').textContent = d.vram_pool.used_gb + ' / ' + d.vram_pool.total_gb + ' GB (' + d.vram_pool.percent + '%)';
      $('badge-vram').textContent = 'VRAM: ' + d.vram_pool.used_gb + ' / 16GB';
    }
  } catch(e) {}
}

async function loadFiles() {
  try {
    const res = await fetch('/api/files');
    const d = await res.json();
    const c = $('file-list');
    if (!d.files.length) {
      c.innerHTML = '<div style="padding:6px; color:var(--muted)">Workspace is empty.</div>';
      return;
    }
    c.innerHTML = d.files.map(f => `
      <div class="file-item">
        <span>${f.rel}</span>
        <span style="color:var(--muted)">${f.size_kb} KB</span>
      </div>
    `).join('');
  } catch(e) {}
}

async function launchTask() {
  const task = $('task-input').value.trim();
  if (!task) return;
  const out = $('console-output');
  out.textContent = '⚡ Hermes Agent started autonomous execution...\n\n';
  $('btn-run').disabled = true;
  $('badge-status').textContent = 'Agent: Running';
  $('badge-status').className = 'badge err';

  const payload = {
    task: task,
    temperature: parseFloat($('cfg-temp').value) || 0.2,
    max_iter: parseInt($('cfg-iter').value) || 35,
    llama_url: 'http://127.0.0.1:8080'
  };

  try {
    const res = await fetch('/api/run', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const reader = res.body.getReader();
    const decoder = new TextDecoder();

    while(true) {
      const {done, value} = await reader.read();
      if (done) break;
      const chunk = decoder.decode(value);
      for (const line of chunk.split('\n')) {
        if (line.startsWith('data: ')) {
          try {
            const data = JSON.parse(line.slice(6));
            if (data.type === 'stdout') {
              out.textContent += data.text;
              out.scrollTop = out.scrollHeight;
            } else if (data.type === 'exit') {
              out.textContent += `\n[Process completed with exit code ${data.code}]`;
              $('badge-status').textContent = data.code === 0 ? 'Agent: Finished' : 'Agent: Failed';
              $('badge-status').className = 'badge ok';
              loadFiles();
            }
          } catch(e) {}
        }
      }
    }
  } catch(err) {
    out.textContent += `\n❌ Connection failure: ${err}`;
  }
  $('btn-run').disabled = false;
}

setInterval(updateStats, 2000);
updateStats();
loadFiles();
</script>
</body>
</html>
